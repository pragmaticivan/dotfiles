#!/bin/sh
set -eu

# Codex updates config.toml itself when plugins, marketplaces, models, and
# desktop integrations change. Merge the managed policy into that live state
# instead of replacing the whole file and discarding those settings.
if ! command -v yq >/dev/null 2>&1; then
    echo "yq is required to merge the managed Codex configuration" >&2
    exit 1
fi

overlay_file=$(mktemp "${TMPDIR:-/tmp}/codex-config.XXXXXX")
trap 'rm -f "$overlay_file"' EXIT HUP INT TERM

cat >"$overlay_file" <<'EOF'
# Work freely in trusted projects, protect home-level credentials, and request
# approval for elevated shell commands and state-changing app actions.
approval_policy = "on-request"
default_permissions = "project-workspace"
web_search = "indexed"
allow_login_shell = true

[permissions.project-workspace]
description = "Trusted workspace editing with approval-gated network access."
extends = ":workspace"

[permissions.project-workspace.filesystem]
glob_scan_max_depth = 8
"~/.ssh" = "read"
"~/.ssh/id_dsa" = "deny"
"~/.ssh/id_ecdsa" = "deny"
"~/.ssh/id_ecdsa_sk" = "deny"
"~/.ssh/id_ed25519" = "deny"
"~/.ssh/id_ed25519_sk" = "deny"
"~/.ssh/id_rsa" = "deny"
"~/.aws" = "deny"
"~/.config/gcloud" = "deny"
"~/.kube" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/vault-token" = "deny"

[permissions.project-workspace.filesystem.":workspace_roots"]
".git" = "write"

[permissions.project-workspace.network]
enabled = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[apps._default]
default_tools_approval_mode = "writes"
destructive_enabled = true
open_world_enabled = true

[analytics]
enabled = false

[feedback]
enabled = false

[features]
multi_agent = true

[agents]
max_threads = 4

[tui]
notifications = true
notification_condition = "unfocused"
EOF

yq eval-all \
    --input-format toml \
    --output-format toml \
    '. as $item ireduce ({}; . * $item)' \
    - "$overlay_file" | \
    yq eval \
        --input-format toml \
        --output-format toml \
        'del(.sandbox_mode, .sandbox_workspace_write) |
        .permissions."project-workspace".filesystem.":workspace_roots" = {".git": "write"}'
