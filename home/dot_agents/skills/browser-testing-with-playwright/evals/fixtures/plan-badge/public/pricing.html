<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>Pricing</h1>
  <section class="grid">
    <article class="card" data-plan="starter">
      <h2 class="name">Starter</h2>
      <p class="price">$0</p>
      <a class="cta" href="#">Get started</a>
    </article>
    <article class="card" data-plan="pro">
      <span class="badge">Most popular</span>
      <h2 class="name">Pro</h2>
      <p class="price">$29</p>
      <a class="cta" href="#">Start trial</a>
    </article>
    <article class="card" data-plan="team">
      <h2 class="name">Team</h2>
      <p class="price">$99</p>
      <a class="cta" href="#">Contact sales</a>
    </article>
  </section>
</body>
</html>
