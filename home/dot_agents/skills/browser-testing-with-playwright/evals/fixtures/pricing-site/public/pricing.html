<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
  <link rel="stylesheet" href="/styles/PricingCard.module.css">
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>
  <h1>Pricing</h1>
  <section class="grid">
    <article class="card" data-plan="starter">
      <h2 class="name">Starter</h2>
      <p class="price">$0</p>
      <ul class="features"><li>1 project</li><li>Community support</li><li>1 GB storage</li></ul>
      <a class="cta" href="#">Get started</a>
    </article>
    <article class="card highlight" data-plan="pro">
      <h2 class="name">Pro</h2>
      <p class="price">$29</p>
      <ul class="features"><li>10 projects</li><li>Email support</li><li>50 GB storage</li></ul>
      <a class="cta" href="#">Start trial</a>
    </article>
    <article class="card" data-plan="team">
      <h2 class="name">Team</h2>
      <p class="price">$99</p>
      <ul class="features"><li>Unlimited projects</li><li>Priority support</li><li>1 TB storage</li></ul>
      <a class="cta" href="#">Contact sales</a>
    </article>
  </section>
</body>
</html>
