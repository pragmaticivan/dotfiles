# Lockfile for third-party agent skills.
# Canonical copy lands in ~/.agents/skills/<name>, symlinked into each agent dir.
# Bump `sha` and run `chezmoi apply --refresh-externals` to update.
# Removing an entry: delete it here and add the paths to .chezmoiremove.
external_skills:
  gh-stack:
    repo: github/gh-stack
    sha: 2a49e6751238633db504655d8a8eba3e433e827d
    path: skills/gh-stack
  skill-creator:
    repo: anthropics/claude-plugins-official
    sha: a7ba5b93db0c7c8d17f3f1d25853adca79598a1a
    path: plugins/skill-creator/skills/skill-creator
  shadcn:
    repo: shadcn-ui/ui
    sha: c0d63c339d6cd2fc26135590a54cf1f362269451
    path: skills/shadcn
  show-me:
    repo: humanlayer/skills
    sha: 69d5fc61d6ca6f7056d283a2ee2a045be741a1d6
    path: plugins/show-me/skills/show-me
  impeccable:
    repo: pbakaus/impeccable
    sha: f5c80432f883a0ee437735305eafc2a9e1bdb7a0
    path: .agent/skills/impeccable
  # The repo holds a roster of skills. Only the flagship one is installed.
  taste-skill:
    repo: Leonxlnx/taste-skill
    sha: 12af471f627f866411b4bd785b19646d3672784c
    path: skills/taste-skill

agent_plugins:
  - name: compound-engineering
    marketplace: compound-engineering-plugin
    repo: EveryInc/compound-engineering-plugin
    sha: 3449230705a508229a5a298671e9031e489f0278
    cursor_plugin: true
    include:
      - .agents
      - .agents/plugins
      - .agents/plugins/**
      - .claude-plugin
      - .claude-plugin/**
      - .codex-plugin
      - .codex-plugin/**
      - .cursor-plugin
      - .cursor-plugin/**
      - assets
      - assets/**
      - plugin.json
      - skills
      - skills/**
  - name: worktrunk
    marketplace: worktrunk
    repo: max-sixty/worktrunk
    sha: e2c8a7d669a6c2766d5c476934efa406763b8daf
    cursor_skill: plugins/worktrunk/skills/worktrunk
    include:
      - .agents
      - .agents/plugins
      - .agents/plugins/**
      - .claude-plugin
      - .claude-plugin/**
      - plugins
      - plugins/worktrunk
      - plugins/worktrunk/**
