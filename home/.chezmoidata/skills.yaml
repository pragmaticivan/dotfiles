# Lockfile for third-party agent skills.
# Canonical copy lands in ~/.agents/skills/<name>, symlinked into each agent dir.
# Bump `sha` and run `chezmoi apply --refresh-externals` to update.
# Removing an entry: delete it here and add the paths to .chezmoiremove.
external_skills:
  gh-stack:
    repo: github/gh-stack
    sha: 2bd699a544a09cb5c45a013d03416e0894b0454e
    path: skills/gh-stack
  skill-creator:
    repo: anthropics/claude-plugins-official
    sha: ab024cdcfa7ca80be204acd4907656ba5a968589
    path: plugins/skill-creator/skills/skill-creator
  shadcn:
    repo: shadcn-ui/ui
    sha: d75a96ab781f3d659be1ad287347d5887ce9f2fc
    path: skills/shadcn
  show-me:
    repo: humanlayer/skills
    sha: ca7c8088db69e315a8b2deea43820270457f8f3c
    path: plugins/show-me/skills/show-me
  impeccable:
    repo: pbakaus/impeccable
    sha: c74755d920985f7a92cef691ca970ba95f90126e
    path: .agent/skills/impeccable
  # The repo holds a roster of skills. Only the flagship one is installed.
  taste-skill:
    repo: Leonxlnx/taste-skill
    sha: ce26fc25c0e5e8cab638f883de62d9a86ee5e45b
    path: skills/taste-skill

agent_plugins:
  - name: compound-engineering
    marketplace: compound-engineering-plugin
    repo: EveryInc/compound-engineering-plugin
    sha: 7ee6e7017184ed955d15336e4da88a42e0bb4136
    include:
      - .agents
      - .agents/plugins
      - .agents/plugins/**
      - .claude-plugin
      - .claude-plugin/**
      - .codex-plugin
      - .codex-plugin/**
      - assets
      - assets/**
      - plugin.json
      - skills
      - skills/**
  - name: worktrunk
    marketplace: worktrunk
    repo: max-sixty/worktrunk
    sha: ca8d3797b245cfa6d31ba797b9097dd7ffb33773
    include:
      - .agents
      - .agents/plugins
      - .agents/plugins/**
      - .claude-plugin
      - .claude-plugin/**
      - plugins
      - plugins/worktrunk
      - plugins/worktrunk/**
