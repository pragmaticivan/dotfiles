name: Ubuntu

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "Makefile"
      - "install/macos/**"
      - "home/.chezmoiscripts/darwin/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "Makefile"
      - "install/macos/**"
      - "home/.chezmoiscripts/darwin/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Test the checked-out tree, not the pushed branch. A remote clone cannot
      # reach a fork's branch, and it cannot see a change before the push.
      - uses: actions/checkout@v7

      - name: Setup dotfiles
        env:
          DOTFILES_DEBUG: 1
          DOTFILES_SOURCE: ${{ github.workspace }}
        run: bash ./setup.sh

      - name: Install latest bats-core
        run: |
          tmp_dir=$(mktemp -d /tmp/bats-core-XXXXX)
          git clone --depth 1 https://github.com/bats-core/bats-core.git "${tmp_dir}"
          cd "${tmp_dir}"
          sudo ./install.sh /usr/local
          rm -rf "${tmp_dir}"

      - name: Test file existence
        run: |
          bats --print-output-on-failure \
            tests/files/common.bats \
            tests/files/ubuntu.bats
