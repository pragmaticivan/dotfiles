name: MacOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "Makefile"
      - "Dockerfile"
      - "install/ubuntu/**"
      - "home/.chezmoiscripts/linux/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "Makefile"
      - "Dockerfile"
      - "install/ubuntu/**"
      - "home/.chezmoiscripts/linux/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14 # M1 Mac

    steps:
      # Test the checked-out tree, not the pushed branch. A remote clone cannot
      # reach a fork's branch, and it cannot see a change before the push.
      - uses: actions/checkout@v7

      - name: Setup dotfiles
        env:
          DOTFILES_DEBUG: 1
          DOTFILES_SOURCE: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./setup.sh

      - name: Test file existence
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install chezmoi bats-core
          bats --print-output-on-failure \
            tests/files/common.bats \
            tests/files/macos.bats
